name: Build APK with Buildozer (Patched NumPy)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TERM: dumb

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Ensure entry file exists
      run: |
        if [ ! -f "main.py" ]; then
          echo "❌ ERROR: main.py not found"
          ls -l
          exit 1
        fi
        echo "✅ main.py found."

    - name: Create required assets
      run: |
        if [ ! -f "wifi_printers.json" ]; then
          echo '[]' > wifi_printers.json
          echo "✅ Created wifi_printers.json"
        fi
        if [ ! -f "icon.png" ]; then
          echo "⚠️ Warning: icon.png not found. Creating placeholder..."
          convert -size 512x512 xc:blue icon.png || echo "⚠️ ImageMagick not installed"
        fi

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          libffi-dev libssl-dev libsqlite3-dev \
          libjpeg-dev libfreetype6-dev zlib1g-dev \
          automake autoconf libtool libtool-bin autopoint gettext pkg-config \
          m4 autoconf-archive make cmake ninja-build \
          imagemagick
        sudo mkdir -p /usr/share/aclocal
        pip install --upgrade pip wheel setuptools Cython==0.29.36
        pip install buildozer==1.4.0

    - name: Patch libtool / autoconf
      run: |
        sudo ln -sf /usr/bin/libtoolize /usr/bin/libtool || true
        echo "m4_pattern_allow([^LT_SYS_SYMBOL_USCORE$])" | sudo tee -a /usr/share/aclocal/libtool.m4 > /dev/null
        echo "m4_pattern_allow([^_LT_PROG_LTMAIN$])" | sudo tee -a /usr/share/aclocal/libtool.m4 > /dev/null

    - name: Cache Buildozer & SDK/NDK
      uses: actions/cache@v3
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: buildozer-${{ runner.os }}-

    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: ~/.gradle
        key: gradle-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Install Android SDK & NDK
      run: |
        mkdir -p $HOME/.buildozer/android/platform
        cd $HOME/.buildozer/android/platform
        if [ ! -d "android-sdk/cmdline-tools/latest" ]; then
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d android-sdk
          mkdir -p android-sdk/cmdline-tools/latest
          mv android-sdk/cmdline-tools/* android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          mkdir -p android-sdk/tools/bin
          ln -sf $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \
                 $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        fi
        yes | $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses || true
        $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
        if [ ! -d "android-ndk-r25b" ]; then
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
          unzip -q ndk.zip
        fi
        mkdir -p android-ndk
        rsync -a android-ndk-r25b/ android-ndk/
        echo "✅ SDK and NDK installed"

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Order Printer
        package.name = orderprinter
        package.domain = org.example
        source.dir = .
        source.include_exts = py,png,jpg,jpeg,ttf,xml,json
        icon.filename = %(source.dir)s/icon.png
        version = 1.0.0
        orientation = portrait
        fullscreen = 0
        requirements = python3==3.11.0, hostpython3==3.11.0, kivy,pyjnius,pillow,plyer,certifi,pyzbar,opencv-python-headless==4.5.5.64,numpy==1.25.2
        android.permissions = CAMERA,VIBRATE,INTERNET,ACCESS_NETWORK_STATE,BLUETOOTH,BLUETOOTH_ADMIN,BLUETOOTH_CONNECT,BLUETOOTH_SCAN,ACCESS_FINE_LOCATION
        android.manifest = android-permissions.xml
        android.manifest.extra = 
            <uses-feature android:name="android.hardware.camera" android:required="false" />
            <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
        android.add_assets = wifi_printers.json
        presplash.filename = %(source.dir)s/icon.png
        android.presplash_color = #FFFFFF
        android.api = 33
        android.minapi = 24
        android.ndk = 25b
        android.ndk_api = 24
        android.archs = arm64-v8a,armeabi-v7a
        p4a.branch = master
        p4a.commit = v2024.01.21
        android.p4a_args = --use-pip
        android.allow_backup = True
        android.enable_androidx = True
        exclude_patterns = tests,docs,*.pyc,*.pyo,*.md,__pycache__,.git
        environment = 
            PYTHONOPTIMIZE=2
            KIVY_METRICS_DENSITY=2
        [buildozer]
        log_level = 2
        warn_on_root = 1
        android.accept_sdk_license = True
        EOF

    # =========================================================
    # FIX NUMPY RECIPE URL (thay .zip bằng .tar.gz)
    # =========================================================
    - name: Fix numpy recipe URL
      run: |
        echo "Đợi p4a clone hoàn tất và sửa URL trong recipe numpy..."
        cat > fix_numpy_recipe.sh << 'SCRIPT'
        #!/bin/bash
        while [ ! -f ~/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/numpy/__init__.py ]; do
          sleep 2
        done
        echo "Đã tìm thấy recipe numpy. Đang sửa URL..."
        sed -i 's|https://pypi.python.org/packages/source/n/numpy/numpy-.*\.zip|https://files.pythonhosted.org/packages/a0/41/8f53eff8e969dd8576ddfb45e7ed315407d27c7518ae49418be8ed532b07/numpy-1.25.2.tar.gz|g' ~/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/numpy/__init__.py
        sed -i 's/numpy-.*\.zip/numpy-1.25.2.tar.gz/g' ~/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/numpy/__init__.py
        echo "✅ Đã sửa URL numpy recipe."
        SCRIPT
        chmod +x fix_numpy_recipe.sh
        ./fix_numpy_recipe.sh &
        echo "✅ Script fix recipe đã khởi động."

    - name: Clean previous builds
      run: |
        buildozer android clean || true
        rm -rf ~/.buildozer/android/platform/build-* || true

    - name: Build APK
      run: |
        export PATH="$HOME/.buildozer/android/platform/android-sdk/tools/bin:$PATH"
        export PATH="$HOME/.buildozer/android/platform/android-sdk/platform-tools:$PATH"
        export PATH="$HOME/.buildozer/android/platform/android-ndk-r25b:$PATH"
        export ANDROID_NDK_HOME="$HOME/.buildozer/android/platform/android-ndk-r25b"
        export ANDROID_NDK_ROOT="$HOME/.buildozer/android/platform/android-ndk-r25b"
        # ⚠️ Export URL_numpy (dù script đã sửa recipe)
        export URL_numpy="https://files.pythonhosted.org/packages/a0/41/8f53eff8e969dd8576ddfb45e7ed315407d27c7518ae49418be8ed532b07/numpy-1.25.2.tar.gz"
        unset ANDROID_HOME ANDROID_SDK_ROOT
        mkdir -p build-logs
        echo "🚀 Starting build..."
        buildozer -v android debug 2>&1 | tee build-logs/full-build-log.txt
        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        if [ $BUILD_EXIT_CODE -eq 0 ]; then
          echo "✅ Build completed successfully"
        else
          echo "❌ Build failed with exit code $BUILD_EXIT_CODE"
          grep -i "error\|failed\|exception" build-logs/full-build-log.txt | tail -50
          exit $BUILD_EXIT_CODE
        fi

    - name: Find and copy APK
      run: |
        APK_PATH=$(find . -name "*.apk" 2>/dev/null | head -1)
        if [ -n "$APK_PATH" ]; then
          mkdir -p bin
          cp "$APK_PATH" bin/app.apk
        else
          echo "❌ No APK found!"
          exit 1
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: orderprinter-app
        path: bin/app.apk
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build-logs/
        retention-days: 7
